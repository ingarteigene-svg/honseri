name: Gårdsbutikk – test og publisering

on:
  push:
    branches: [main]
    paths: ['gardsbutikk/**', '.github/workflows/gardsbutikk.yml']
  pull_request:
    paths: ['gardsbutikk/**', '.github/workflows/gardsbutikk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gardsbutikk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gardsbutikk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gardsbutikk/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    # Publiserer bare fra main, og bare når Cloudflare-oppsettet finnes
    # (Settings → Secrets and variables → Actions). Samme konto og API-token som
    # Pallsporing og Hønseri, men egne Workers («gardsbutikk» og «gardsbutikk-admin»)
    # og egen database.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gardsbutikk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GARDSBUTIKK_D1_DATABASE_ID: ${{ secrets.GARDSBUTIKK_D1_DATABASE_ID }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      GARDSBUTIKK_ACCESS_AUD: ${{ secrets.GARDSBUTIKK_ACCESS_AUD }}
      GARDSBUTIKK_VIPPS_CLIENT_ID: ${{ secrets.GARDSBUTIKK_VIPPS_CLIENT_ID }}
      GARDSBUTIKK_VIPPS_CLIENT_SECRET: ${{ secrets.GARDSBUTIKK_VIPPS_CLIENT_SECRET }}
      GARDSBUTIKK_VIPPS_SUBSCRIPTION_KEY: ${{ secrets.GARDSBUTIKK_VIPPS_SUBSCRIPTION_KEY }}
      GARDSBUTIKK_VIPPS_MSN: ${{ secrets.GARDSBUTIKK_VIPPS_MSN }}
      GARDSBUTIKK_VIPPS_ENV: ${{ secrets.GARDSBUTIKK_VIPPS_ENV }}
    steps:
      - name: Sjekk oppsett
        id: cfg
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare er ikke satt opp – publisering hoppes over (se gardsbutikk/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$GARDSBUTIKK_ACCESS_AUD" ]; then
            echo "::notice::GARDSBUTIKK_ACCESS_AUD mangler – adminsiden publiseres, men er stengt til innlogging er satt opp (README, del B)."
          fi
          if [ -z "$GARDSBUTIKK_VIPPS_MSN" ]; then
            echo "::notice::Vipps-nøklene mangler – butikken tar bare kontant til de er lagt inn (README, del C)."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gardsbutikk/package-lock.json
      - run: npm ci
        if: steps.cfg.outputs.ready == 'true'
      - name: Finn/opprett database, migrer og publiser butikk og admin
        if: steps.cfg.outputs.ready == 'true'
        run: npm run deploy
